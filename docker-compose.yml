services:
  backend:
    build:
      context: ./backend/ContainerScope.Api
      dockerfile: Dockerfile
    container_name: containerscope-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: containerscope-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
